name: OpenStreetMap extract
on:
  push:
    branches: [main]
    paths: ['osm/request.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/osm-fetch.mjs
      - run: |
          git config user.name "osm-bot"
          git config user.email "osm-bot@users.noreply.github.com"
          git add osm
          git commit -m "OpenStreetMap extract ($(node -e "console.log(require('./osm/request.json').job)"))" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
